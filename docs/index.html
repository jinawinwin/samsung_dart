<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>삼성전자 재무 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F4F2EC;
    --paper-raised:#FBFAF6;
    --ink:#181C1A;
    --ink-soft:#5B615C;
    --rule:#D8D4C8;
    --rule-strong:#B7B2A2;
    --brass:#9C7A3C;
    --pos:#2F6F4E;
    --neg:#A13D3D;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#14171A;
      --paper-raised:#1B1F22;
      --ink:#EDEBE3;
      --ink-soft:#9A9A90;
      --rule:#33362F;
      --rule-strong:#4A4C42;
      --brass:#C9A15C;
      --pos:#5FA97D;
      --neg:#D2726B;
    }
  }
  :root[data-theme="dark"]{
    --paper:#14171A; --paper-raised:#1B1F22; --ink:#EDEBE3; --ink-soft:#9A9A90;
    --rule:#33362F; --rule-strong:#4A4C42; --brass:#C9A15C; --pos:#5FA97D; --neg:#D2726B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Mono', ui-monospace, monospace;
    line-height:1.5;
  }
  .wrap{max-width:920px; margin:0 auto; padding:2.5rem 1.25rem 5rem;}
  h1,h2{font-family:'Fraunces', Georgia, serif; font-weight:600; margin:0;}
  header.masthead{
    display:flex; justify-content:space-between; align-items:baseline;
    border-bottom:2px solid var(--ink); padding-bottom:1rem; margin-bottom:2rem; flex-wrap:wrap; gap:.5rem;
  }
  header.masthead h1{font-size:clamp(1.5rem, 4vw, 2.1rem);}
  header.masthead .meta{font-size:.78rem; color:var(--ink-soft); text-align:right;}

  .hero{display:flex; flex-wrap:wrap; gap:2.5rem; align-items:flex-end; margin-bottom:2.5rem;}
  .hero .label{font-size:.8rem; color:var(--ink-soft); margin-bottom:.35rem;}
  .hero .big{font-family:'Fraunces', Georgia, serif; font-weight:500; font-size:clamp(2.6rem,8vw,4.2rem); line-height:1;}
  .delta{font-size:1rem; margin-left:.6rem; vertical-align:middle;}
  .delta.up{color:var(--pos);} .delta.down{color:var(--neg);}

  .ratio-strip{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(120px,1fr));
    border-top:1px solid var(--rule-strong); border-bottom:1px solid var(--rule-strong);
    margin-bottom:2.5rem;
  }
  .ratio-strip div{padding:.9rem .8rem; border-left:1px solid var(--rule);}
  .ratio-strip div:first-child{border-left:none;}
  .ratio-strip .r-label{font-size:.72rem; color:var(--ink-soft); margin-bottom:.3rem;}
  .ratio-strip .r-value{font-size:1.25rem; font-weight:600;}

  .charts{display:grid; grid-template-columns:1fr 1fr; gap:2rem; margin-bottom:3rem;}
  @media (max-width:680px){.charts{grid-template-columns:1fr;}}
  .chart-card{background:var(--paper-raised); border:1px solid var(--rule); padding:1rem 1rem .5rem;}
  .chart-card h2{font-size:1rem; margin-bottom:.75rem;}

  table{width:100%; border-collapse:collapse; font-size:.82rem;}
  thead th{
    text-align:right; font-weight:600; padding:.5rem .4rem; border-bottom:2px solid var(--ink);
    font-family:'IBM Plex Mono'; color:var(--ink-soft); font-size:.72rem;
  }
  thead th:first-child, tbody td:first-child{text-align:left;}
  tbody td{padding:.45rem .4rem; text-align:right; border-bottom:1px solid var(--rule); font-variant-numeric:tabular-nums;}
  tbody tr:hover{background:var(--paper-raised);}
  .neg-val{color:var(--neg);}

  footer{margin-top:3rem; padding-top:1rem; border-top:1px solid var(--rule); font-size:.72rem; color:var(--ink-soft);}
  footer a{color:var(--brass);}

  .empty{padding:3rem 1rem; text-align:center; color:var(--ink-soft); font-size:.9rem;}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <h1>삼성전자 재무 대시보드</h1>
    <div class="meta" id="meta">불러오는 중...</div>
  </header>

  <div id="content">
    <div class="empty">데이터를 불러오는 중입니다...</div>
  </div>

  <footer>
    데이터 출처: <a href="https://opendart.fss.or.kr" target="_blank" rel="noopener">OpenDART 전자공시시스템</a> ·
    이 페이지는 GitHub Actions가 매달 자동으로 갱신합니다. 자동 파싱 결과이므로 중요한 의사결정 전에는 원본 공시를 대조하세요.
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script>
const fmtTrillion = (won) => won == null ? '—' : (won/1e12).toFixed(2);
const fmtPct = (v) => v == null ? '—' : v.toFixed(2) + '%';
const fmtDelta = (v) => {
  if (v == null) return '';
  const cls = v >= 0 ? 'up' : 'down';
  const arrow = v >= 0 ? '▲' : '▼';
  return `<span class="delta ${cls}">${arrow} ${Math.abs(v).toFixed(1)}%</span>`;
};

fetch('./data.json').then(r => r.json()).then(renderDashboard).catch(() => {
  document.getElementById('content').innerHTML =
    '<div class="empty">데이터를 아직 불러올 수 없습니다. GitHub Actions 워크플로가 최소 한 번 실행된 뒤 다시 확인해 주세요.</div>';
});

function renderDashboard(data) {
  const years = (data.years || []).filter(y => y.revenue != null || y.total_assets != null);
  document.getElementById('meta').textContent =
    `생성: ${new Date(data.generated_at).toLocaleString('ko-KR')} · ${data.company || ''}`;

  if (years.length === 0) {
    document.getElementById('content').innerHTML =
      '<div class="empty">아직 파싱된 재무 데이터가 없습니다. scripts/parse_xbrl.py 실행 결과를 확인해 주세요.</div>';
    return;
  }

  const latest = years[years.length - 1];
  const content = document.getElementById('content');

  content.innerHTML = `
    <div class="hero">
      <div>
        <div class="label">${latest.fiscal_year}년 매출액</div>
        <div class="big">${fmtTrillion(latest.revenue)}조 ${fmtDelta(latest.revenue_yoy_pct)}</div>
      </div>
    </div>

    <div class="ratio-strip">
      <div><div class="r-label">영업이익률</div><div class="r-value">${fmtPct(latest.operating_margin_pct)}</div></div>
      <div><div class="r-label">순이익률</div><div class="r-value">${fmtPct(latest.net_margin_pct)}</div></div>
      <div><div class="r-label">ROE</div><div class="r-value">${fmtPct(latest.roe_pct)}</div></div>
      <div><div class="r-label">ROA</div><div class="r-value">${fmtPct(latest.roa_pct)}</div></div>
      <div><div class="r-label">부채비율</div><div class="r-value">${fmtPct(latest.debt_ratio_pct)}</div></div>
    </div>

    <div class="charts">
      <div class="chart-card">
        <h2>매출·영업이익·순이익 (조 원)</h2>
        <canvas id="chartAmounts" height="200"></canvas>
      </div>
      <div class="chart-card">
        <h2>수익성 지표 (%)</h2>
        <canvas id="chartMargins" height="200"></canvas>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>연도</th><th>매출액</th><th>영업이익</th><th>순이익</th>
          <th>영업이익률</th><th>순이익률</th><th>ROE</th><th>부채비율</th>
        </tr>
      </thead>
      <tbody>
        ${years.map(y => `
          <tr>
            <td>${y.fiscal_year}</td>
            <td>${fmtTrillion(y.revenue)}</td>
            <td class="${y.operating_income < 0 ? 'neg-val' : ''}">${fmtTrillion(y.operating_income)}</td>
            <td class="${y.net_income < 0 ? 'neg-val' : ''}">${fmtTrillion(y.net_income)}</td>
            <td>${fmtPct(y.operating_margin_pct)}</td>
            <td>${fmtPct(y.net_margin_pct)}</td>
            <td>${fmtPct(y.roe_pct)}</td>
            <td>${fmtPct(y.debt_ratio_pct)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;

  try {
    renderCharts(years);
  } catch (e) {
    console.error('차트 렌더링 실패:', e);
    document.querySelectorAll('.chart-card').forEach(el => {
      el.innerHTML = '<div class="empty">차트를 그리지 못했습니다 (라이브러리 로드 실패). 표는 정상입니다.</div>';
    });
  }
}

function renderCharts(years) {
  const labels = years.map(y => y.fiscal_year);
  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  new Chart(document.getElementById('chartAmounts'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '매출액', data: years.map(y => y.revenue != null ? y.revenue/1e12 : null), borderColor: cssVar('--ink'), tension: .2 },
        { label: '영업이익', data: years.map(y => y.operating_income != null ? y.operating_income/1e12 : null), borderColor: cssVar('--brass'), tension: .2 },
        { label: '순이익', data: years.map(y => y.net_income != null ? y.net_income/1e12 : null), borderColor: cssVar('--pos'), tension: .2 },
      ]
    },
    options: { responsive: true, plugins: { legend: { labels: { color: cssVar('--ink') } } },
      scales: { x: { ticks: { color: cssVar('--ink-soft') }, grid: { color: cssVar('--rule') } },
                y: { ticks: { color: cssVar('--ink-soft') }, grid: { color: cssVar('--rule') } } } }
  });

  new Chart(document.getElementById('chartMargins'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label: '영업이익률', data: years.map(y => y.operating_margin_pct), borderColor: cssVar('--brass'), tension: .2 },
        { label: '순이익률', data: years.map(y => y.net_margin_pct), borderColor: cssVar('--pos'), tension: .2 },
        { label: 'ROE', data: years.map(y => y.roe_pct), borderColor: cssVar('--neg'), tension: .2 },
      ]
    },
    options: { responsive: true, plugins: { legend: { labels: { color: cssVar('--ink') } } },
      scales: { x: { ticks: { color: cssVar('--ink-soft') }, grid: { color: cssVar('--rule') } },
                y: { ticks: { color: cssVar('--ink-soft') }, grid: { color: cssVar('--rule') } } } }
  });
}
</script>
</body>
</html>
